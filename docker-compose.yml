services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: returndesk
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: returndesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returndesk -d returndesk"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: returndesk
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: returndesk_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  postgres-data:
